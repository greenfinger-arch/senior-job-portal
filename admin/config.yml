backend:
  name: github
  repo: greenfinger-arch/senior-job-portal
  branch: main
  base_url: https://black-sun-634d.garcia47stand.workers.dev
  auth_endpoint: /auth

site_url: https://rework5060.com/
display_url: https://rework5060.com/

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "posts"
    label: "기사/콘텐츠"
    folder: "posts"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "제목"
        name: "title"
        widget: "string"

      - label: "영문 URL 슬러그"
        name: "slug"
        widget: "string"
        required: true
        hint: "예: national-support-card-guide (소문자, 하이픈만 사용)"

      - label: "카테고리"
        name: "category"
        widget: "select"
        options:
          - "시니어 재취업"
          - "중장년 부업/N잡"
          - "교육/자격증"
          - "정부 지원금"

      - label: "📌 카테고리 기둥 기사(Pillar Content)로 고정"
        name: "is_pillar"
        widget: "boolean"
        default: false
        required: false

      - label: "발행일"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"

      - label: "대표 이미지"
        name: "thumbnail"
        widget: "image"
        required: false

      - label: "요약문"
        name: "excerpt"
        widget: "text"

      - label: "본문 내용"
        name: "body"
        widget: "markdown"