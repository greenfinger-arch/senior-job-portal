backend:
  name: github
  repo: greenfinger-arch/senior-job-portal # 깃허브 계정/저장소명[cite: 4]
  branch: main # 기본 브랜치명[cite: 4]
  base_url: https://black-sun-634d.garcia47stand.workers.dev
  auth_endpoint: /auth

site_url: https://rework5060.com/[cite: 4]
display_url: https://rework5060.com/[cite: 4]

media_folder: "images/uploads"[cite: 4]
public_folder: "/images/uploads"[cite: 4]

collections:
  - name: "posts"[cite: 4]
    label: "기사/콘텐츠"[cite: 4]
    folder: "posts"[cite: 4]
    create: true[cite: 4]
    # 👇 [수정 1] 날짜 규칙 제거 -> 순수 슬러그명으로만 저장 (예: national-support-card-guide.md)
    slug: "{{slug}}"
    fields:
      - { label: "제목", name: "title", widget: "string" }[cite: 4]
      # 👇 [수정 2] 영문 URL 슬러그 필드 추가
      - { 
          label: "영문 URL 슬러그", 
          name: "slug", 
          widget: "string", 
          required: true, 
          hint: "예: national-support-card-guide (소문자, 하이픈만 사용)" 
        }
      - { 
          label: "카테고리", 
          name: "category", 
          widget: "select", 
          options: ["시니어 재취업", "중장년 부업/N잡", "교육/자격증", "정부 지원금"] 
        }[cite: 4]
      - { 
          label: "📌 카테고리 기둥 기사(Pillar Content)로 고정", 
          name: "is_pillar", 
          widget: "boolean", 
          default: false, 
          required: false 
        }[cite: 4]
      - { label: "발행일", name: "date", widget: "datetime", format: "YYYY-MM-DD" }[cite: 4]
      - { label: "대표 이미지", name: "thumbnail", widget: "image", required: false }[cite: 4]
      - { label: "요약문", name: "excerpt", widget: "text" }[cite: 4]
      - { label: "본문 내용", name: "body", widget: "markdown" }[cite: 4]