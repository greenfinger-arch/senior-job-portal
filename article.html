<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>기사 상세 보기 - 시니어내일포럼</title>

  <!-- 웹폰트 및 기본 CSS -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="/style.css">

  <style>
    body {
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif !important;
      background-color: #f8fafc;
      color: #1e293b;
      margin: 0;
      padding: 0;
    }

    /* 포럼/뉴스 매거진 스타일의 차분한 레이아웃 */
    .article-container { 
      max-width: 820px; 
      margin: 40px auto; 
      padding: 50px 40px; 
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
    }
    
    .article-header { 
      border-bottom: 2px solid #0f172a; 
      padding-bottom: 25px; 
      margin-bottom: 35px; 
    }

    .article-category { 
      display: inline-block; 
      padding: 4px 12px; 
      border-radius: 4px; 
      font-size: 14px; 
      font-weight: 700; 
      color: #0f172a; 
      background-color: #e2e8f0;
      margin-bottom: 16px; 
    }

    .article-title { 
      font-size: 2.2rem; 
      line-height: 1.4; 
      margin: 0 0 20px 0; 
      color: #0f172a; 
      font-weight: 800;
      word-break: keep-all;
      letter-spacing: -0.02em;
    }

    .article-meta-info {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #64748b;
      font-size: 14px;
      font-weight: 500;
    }

    .article-thumb { 
      width: 100%; 
      max-height: 460px; 
      object-fit: cover; 
      border-radius: 8px; 
      margin-bottom: 40px; 
      border: 1px solid #e2e8f0;
    }

    /* 마크다운 본문 렌더링 스타일 (차분한 정통 아티클 서식) */
    .article-body { 
      font-size: 1.15rem; 
      line-height: 1.9; 
      color: #334155; 
      word-break: keep-all;
    }

    /* ## 소제목 정상 렌더링 스타일 */
    .article-body h2 { 
      font-size: 1.55rem; 
      color: #0f172a;
      border-left: 4px solid #2563eb; 
      padding-left: 14px; 
      margin: 45px 0 20px; 
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    /* ### 소제목 정상 렌더링 스타일 */
    .article-body h3 { 
      font-size: 1.3rem; 
      color: #1e293b;
      margin: 32px 0 16px; 
      padding-bottom: 8px;
      border-bottom: 1px solid #e2e8f0;
      font-weight: 700;
    }

    .article-body p {
      margin-bottom: 22px;
    }

    /* **볼드** 강조 문구 */
    .article-body strong {
      color: #0f172a;
      font-weight: 700;
      background: linear-gradient(to top, #e0f2fe 50%, transparent 50%);
    }

    /* > 인용구 (전문가 한마디 / 핵심 요약) */
    .article-body blockquote { 
      background-color: #f8fafc; 
      border-left: 4px solid #0f172a; 
      padding: 20px 24px; 
      margin: 30px 0; 
      border-radius: 0 6px 6px 0; 
      color: #1e293b;
      font-size: 1.08rem;
      border-top: 1px solid #e2e8f0;
      border-right: 1px solid #e2e8f0;
      border-bottom: 1px solid #e2e8f0;
    }

    .article-body blockquote p {
      margin: 0 0 8px 0;
    }
    .article-body blockquote p:last-child {
      margin: 0;
    }

    /* 목록 스타일 (ul, ol) */
    .article-body ul, .article-body ol {
      margin: 20px 0 28px 20px;
      padding-left: 10px;
    }

    .article-body li {
      margin-bottom: 10px;
      line-height: 1.8;
    }

    /* 표(Table) 정상 렌더링 스타일 */
    .article-body table { 
      width: 100%; 
      border-collapse: collapse; 
      margin: 32px 0; 
      border: 1px solid #cbd5e1;
    }

    .article-body th, .article-body td { 
      border: 1px solid #cbd5e1; 
      padding: 14px 16px; 
      text-align: left; 
      font-size: 1.02rem;
    }

    .article-body th { 
      background-color: #f1f5f9; 
      color: #0f172a;
      font-weight: 700;
    }

    .article-body tr:nth-child(even) {
      background-color: #f8fafc;
    }

    .article-body hr {
      border: none;
      border-top: 1px solid #e2e8f0;
      margin: 40px 0;
    }

    /* 하단 버튼 */
    .back-btn-wrapper {
      margin-top: 50px;
      padding-top: 25px;
      border-top: 1px solid #e2e8f0;
    }

    .back-btn { 
      display: inline-block; 
      padding: 12px 24px; 
      background: #0f172a; 
      color: #ffffff; 
      text-decoration: none; 
      border-radius: 6px; 
      font-weight: 700;
      font-size: 15px;
    }

    .back-btn:hover {
      background: #2563eb;
    }

    @media (max-width: 768px) {
      .article-container { padding: 28px 20px; margin: 15px auto; }
      .article-title { font-size: 1.75rem; }
    }
  </style>
</head>
<body>

  <!-- 헤더 -->
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="brand-logo">
        <span class="logo-badge">5060</span> 시니어내일포럼
      </a>
      <button class="mobile-menu-toggle" id="menuToggle" aria-label="메뉴 열기">
        <span></span><span></span><span></span>
      </button>
      <nav class="main-nav" id="mainNav">
        <ul>
          <li><a href="jobs.html">시니어 재취업</a></li>
          <li><a href="side-hustle.html">중장년 부업/N잡</a></li>
          <li><a href="education.html">교육/자격증</a></li>
          <li><a href="welfare.html">정부 지원금</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="article-container">
    <div id="articleContent">
      <p style="text-align: center; padding: 60px 0; color: #64748b;">기사 내용을 불러오는 중입니다...</p>
    </div>
    
    <div class="back-btn-wrapper">
      <a href="javascript:history.back()" class="back-btn">&larr; 목록으로 돌아가기</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <script>
    const GITHUB_REPO = "greenfinger-arch/senior-job-portal";
    const GITHUB_BRANCH = "main";

    // Marked 옵션 설정 (줄바꿈 및 표 문법 강제 지원)
    marked.setOptions({
      gfm: true,
      breaks: true
    });

    document.addEventListener("DOMContentLoaded", async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const slug = urlParams.get("slug");
      const contentDiv = document.getElementById("articleContent");

      if (!slug) {
        contentDiv.innerHTML = "<p style='text-align:center;'>존재하지 않는 기사입니다.</p>";
        return;
      }

      try {
        const rawUrl = `https://raw.githubusercontent.com/${GITHUB_REPO}/${GITHUB_BRANCH}/posts/${slug}.md`;
        const res = await fetch(rawUrl);

        if (!res.ok) {
          contentDiv.innerHTML = "<p style='text-align:center;'>기사를 찾을 수 없습니다.</p>";
          return;
        }

        const text = await res.text();
        const parts = text.split(/^---$/m);
        
        let frontmatter = {};
        let body = text;

        if (parts.length >= 3) {
          frontmatter = jsyaml.load(parts[1]);
          // 파싱 중 윈도우/맥 줄바꿈 차이 보정
          body = parts.slice(2).join("---").trim();
        }

        // 마크다운을 정식 HTML로 파싱
        const htmlBody = marked.parse(body);

        contentDiv.innerHTML = `
          <article class="article-header">
            <span class="article-category">${frontmatter.category || '기타'}</span>
            <h1 class="article-title">${frontmatter.title || '제목 없음'}</h1>
            <div class="article-meta-info">
              <span>발행일: ${frontmatter.date ? String(frontmatter.date).substring(0, 10) : ''}</span>
              <span>•</span>
              <span>시니어내일포럼 편집국</span>
            </div>
          </article>
          ${frontmatter.thumbnail ? `<img src="${frontmatter.thumbnail}" class="article-thumb" alt="대표 이미지">` : ''}
          <div class="article-body">
            ${htmlBody}
          </div>
        `;
      } catch (err) {
        console.error(err);
        contentDiv.innerHTML = "<p style='text-align:center;'>기사를 로딩하는 중 오류가 발생했습니다.</p>";
      }
    });

    const menuToggle = document.getElementById('menuToggle');
    const mainNav = document.getElementById('mainNav');
    if (menuToggle && mainNav) {
      menuToggle.addEventListener('click', () => mainNav.classList.toggle('open'));
    }
  </script>
</body>
</html>
