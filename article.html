<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>기사 상세 보기 - 시니어내일포럼</title>

  <!-- 웹폰트 및 기본 CSS -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="/style.css">

  <style>
    body {
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif !important;
      background-color: #f8fafc;
      color: #1e293b;
      margin: 0;
      padding: 0;
    }

    /* 상단 읽기 진행률 바 (Reading Progress Bar) */
    #progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 4px;
      background: #2563eb;
      width: 0%;
      z-index: 9999;
      transition: width 0.1s ease-out;
    }

    /* 포럼/뉴스 매거진 스타일 레이아웃 */
    .article-container { 
      max-width: 820px; 
      margin: 40px auto; 
      padding: 50px 40px; 
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
    }
    
    .article-header { 
      border-bottom: 2px solid #0f172a; 
      padding-bottom: 25px; 
      margin-bottom: 35px; 
    }

    .article-category { 
      display: inline-block; 
      padding: 4px 12px; 
      border-radius: 4px; 
      font-size: 14px; 
      font-weight: 700; 
      color: #0f172a; 
      background-color: #e2e8f0;
      margin-bottom: 16px; 
    }

    .article-title { 
      font-size: 2.2rem; 
      line-height: 1.4; 
      margin: 0 0 20px 0; 
      color: #0f172a; 
      font-weight: 800;
      word-break: keep-all;
      letter-spacing: -0.02em;
    }

    .article-meta-info {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #64748b;
      font-size: 14px;
      font-weight: 500;
      flex-wrap: wrap;
    }

    .article-thumb { 
      width: 100%; 
      max-height: 460px; 
      object-fit: cover; 
      border-radius: 8px; 
      margin-bottom: 40px; 
      border: 1px solid #e2e8f0;
    }

    /* 마크다운 본문 렌더링 스타일 */
    .article-body { 
      font-size: 1.15rem; 
      line-height: 1.9; 
      color: #334155; 
      word-break: keep-all;
    }

    /* ## 소제목 스타일 */
    .article-body h2 { 
      font-size: 1.55rem; 
      color: #0f172a;
      border-left: 4px solid #2563eb; 
      padding-left: 14px; 
      margin: 45px 0 20px; 
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    /* ### 소제목 스타일 */
    .article-body h3 { 
      font-size: 1.3rem; 
      color: #1e293b;
      margin: 32px 0 16px; 
      padding-bottom: 8px;
      border-bottom: 1px solid #e2e8f0;
      font-weight: 700;
    }

    .article-body p {
      margin-bottom: 22px;
    }

    /* **볼드** 강조 */
    .article-body strong {
      color: #0f172a;
      font-weight: 700;
      background: linear-gradient(to top, #e0f2fe 50%, transparent 50%);
    }

    /* > 인용구 (전문가 한마디 / 핵심 요약) */
    .article-body blockquote { 
      background-color: #f8fafc; 
      border-left: 4px solid #0f172a; 
      padding: 20px 24px; 
      margin: 30px 0; 
      border-radius: 0 6px 6px 0; 
      color: #1e293b;
      font-size: 1.08rem;
      border-top: 1px solid #e2e8f0;
      border-right: 1px solid #e2e8f0;
      border-bottom: 1px solid #e2e8f0;
    }

    .article-body blockquote p {
      margin: 0 0 8px 0;
    }
    .article-body blockquote p:last-child {
      margin: 0;
    }

    /* 리스트 스타일 */
    .article-body ul, .article-body ol {
      margin: 20px 0 28px 20px;
      padding-left: 10px;
    }

    .article-body li {
      margin-bottom: 10px;
      line-height: 1.8;
    }

    /* 표(Table) 스타일 */
    .article-body table { 
      width: 100%; 
      border-collapse: collapse; 
      margin: 32px 0; 
      border: 1px solid #cbd5e1;
    }

    .article-body th, .article-body td { 
      border: 1px solid #cbd5e1; 
      padding: 14px 16px; 
      text-align: left; 
      font-size: 1.02rem;
    }

    .article-body th { 
      background-color: #f1f5f9; 
      color: #0f172a;
      font-weight: 700;
    }

    .article-body tr:nth-child(even) {
      background-color: #f8fafc;
    }

    .article-body hr {
      border: none;
      border-top: 1px solid #e2e8f0;
      margin: 40px 0;
    }

    /* 하단 버튼 */
    .back-btn-wrapper {
      margin-top: 50px;
      padding-top: 25px;
      border-top: 1px solid #e2e8f0;
    }

    .back-btn { 
      display: inline-block; 
      padding: 12px 24px; 
      background: #0f172a; 
      color: #ffffff; 
      text-decoration: none; 
      border-radius: 6px; 
      font-weight: 700;
      font-size: 15px;
    }

    .back-btn:hover {
      background: #2563eb;
    }

    @media (max-width: 768px) {
      .article-container { padding: 28px 20px; margin: 15px auto; }
      .article-title { font-size: 1.75rem; }
    }
  </style>
</head>
<body>

  <!-- 읽기 진행률 스크롤 바 -->
  <div id="progress-bar"></div>

  <!-- 헤더 -->
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="brand-logo">
        <span class="logo-badge">5060</span> 시니어내일포럼
      </a>
      <button class="mobile-menu-toggle" id="menuToggle" aria-label="메뉴 열기">
        <span></span><span></span><span></span>
      </button>
      <nav class="main-nav" id="mainNav">
        <ul>
          <li><a href="jobs.html">시니어 재취업</a></li>
          <li><a href="side-hustle.html">중장년 부업/N잡</a></li>
          <li><a href="education.html">교육/자격증</a></li>
          <li><a href="welfare.html">정부 지원금</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="article-container">
    <div id="articleContent">
      <p style="text-align: center; padding: 60px 0; color: #64748b;">기사 내용을 불러오는 중입니다...</p>
    </div>
    
    <div class="back-btn-wrapper">
      <a href="javascript:history.back()" class="back-btn">&larr; 목록으로 돌아가기</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <script>
    const GITHUB_REPO = "greenfinger-arch/senior-job-portal";
    const GITHUB_BRANCH = "main";

    marked.setOptions({
      gfm: true,
      breaks: true
    });

    // 📌 1. 마크다운 강조 기호(**) 정밀 정제 함수
    function cleanMarkdownFormatting(text) {
      if (!text) return "";
      return text
        .replace(/\*\s*["'“‘]\s*\*\*(.*?)\*\*\s*["'”’]\s*\*/g, '<em>"$1"</em>')
        .replace(/(["'“‘])\s*\*\*(.*?)\*\*\s*(["'”’])/g, '$1<strong>$2</strong>$3')
        .replace(/\*\*\s*(["'“‘].*?["'”’])\s*\*\*/g, '<strong>$1</strong>')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    }

    // 📌 2. 동적 OG 메타 태그 & Meta Description 제어
    function updateMetaTags(frontmatter, articleUrl) {
      const description = frontmatter.excerpt || frontmatter.title || '시니어 재취업 및 중장년 정보 포럼';
      const image = frontmatter.thumbnail || `${window.location.origin}/images/default-og.png`;

      const metaList = [
        { name: "description", content: description },
        { property: "og:title", content: `${frontmatter.title} - 시니어내일포럼` },
        { property: "og:description", content: description },
        { property: "og:image", content: image },
        { property: "og:url", content: articleUrl },
        { property: "og:type", content: "article" },
        { name: "twitter:card", content: "summary_large_image" },
        { name: "twitter:title", content: frontmatter.title },
        { name: "twitter:description", content: description },
        { name: "twitter:image", content: image }
      ];

      metaList.forEach(data => {
        let el = data.name 
          ? document.querySelector(`meta[name="${data.name}"]`)
          : document.querySelector(`meta[property="${data.property}"]`);

        if (!el) {
          el = document.createElement("meta");
          if (data.name) el.setAttribute("name", data.name);
          if (data.property) el.setAttribute("property", data.property);
          document.head.appendChild(el);
        }
        el.setAttribute("content", data.content);
      });
    }

    // 📌 3. 예상 읽기 시간 계산 함수
    function calculateReadingTime(text) {
      const wordsPerMinute = 200;
      const cleanText = text.replace(/<[^>]*>?/gm, '');
      const minutes = Math.ceil(cleanText.length / wordsPerMinute);
      return minutes < 1 ? 1 : minutes;
    }

    document.addEventListener("DOMContentLoaded", async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const slug = urlParams.get("slug");
      const contentDiv = document.getElementById("articleContent");

      if (!slug) {
        contentDiv.innerHTML = "<p style='text-align:center;'>존재하지 않는 기사입니다.</p>";
        return;
      }

      try {
        const cacheKey = `article_${slug}`;
        let text = sessionStorage.getItem(cacheKey);

        if (!text) {
          const rawUrl = `https://raw.githubusercontent.com/${GITHUB_REPO}/${GITHUB_BRANCH}/posts/${slug}.md`;
          const res = await fetch(rawUrl);

          if (!res.ok) {
            contentDiv.innerHTML = "<p style='text-align:center;'>기사를 찾을 수 없습니다.</p>";
            return;
          }

          text = await res.text();
        }

        const parts = text.split(/^---$/m);
        let frontmatter = {};
        let body = text;

        if (parts.length >= 3) {
          frontmatter = jsyaml.load(parts[1]);
          body = parts.slice(2).join("---").trim();
        }

        // 📌 4. [신규 추가] 예약 발행 판별 로직
        if (frontmatter.date) {
          const publishDate = new Date(frontmatter.date);
          const now = new Date();

          // 아직 설정된 발행 일시가 지나지 않은 경우
          if (publishDate > now) {
            sessionStorage.removeItem(cacheKey); // 공개 전 기사가 캐시에 남지 않도록 삭제

            const formattedPublishDate = publishDate.toLocaleString('ko-KR', {
              year: 'numeric',
              month: 'long',
              day: 'numeric',
              hour: '2-digit',
              minute: '2-digit'
            });

            contentDiv.innerHTML = `
              <div style="text-align: center; padding: 80px 20px; background: #f8fafc; border-radius: 8px; border: 1px dashed #cbd5e1;">
                <p style="font-size: 2.5rem; margin-bottom: 10px;">⏳</p>
                <h2 style="font-size: 1.4rem; color: #0f172a; margin-bottom: 12px; font-weight: 700;">예약 발행 예정 기사입니다</h2>
                <p style="color: #64748b; font-size: 1rem; margin-bottom: 0;">
                  본 기사는 <strong>${formattedPublishDate}</strong>에 공개될 예정입니다.
                </p>
              </div>
            `;
            return; // 예약 기사일 경우 이하 렌더링 및 SEO 스크립트 실행 중단
          }
        }

        // 정상 공개 기사만 캐시에 저장
        sessionStorage.setItem(cacheKey, text);

        // 📌 5. 마크다운 변환 및 이미지 최적화
        let htmlBody = typeof marked.parse === "function" ? marked.parse(body) : marked(body);
        htmlBody = cleanMarkdownFormatting(htmlBody);
        htmlBody = htmlBody.replace(/<img /g, `<img loading="lazy" alt="${frontmatter.title || '기사 이미지'}" `);

        // 📌 6. Title 및 Meta 태그 업데이트
        const articleUrl = window.location.href;
        if (frontmatter.title) {
          document.title = `${frontmatter.title} - 시니어내일포럼`;
        }
        updateMetaTags(frontmatter, articleUrl);

        // 📌 7. 예상 읽기 시간 측정
        const readingTime = calculateReadingTime(body);

        // 📌 8. 본문 화면 렌더링
        contentDiv.innerHTML = `
          <article class="article-header">
            <span class="article-category">${frontmatter.category || '기타'}</span>
            <h1 class="article-title">${frontmatter.title || '제목 없음'}</h1>
            <div class="article-meta-info">
              <span>발행일: ${frontmatter.date ? String(frontmatter.date).substring(0, 10) : ''}</span>
              <span>•</span>
              <span>시니어내일포럼 편집국</span>
              <span>•</span>
              <span>⏱️ 읽는 시간 약 ${readingTime}분</span>
            </div>
          </article>
          ${frontmatter.thumbnail ? `<img src="${frontmatter.thumbnail}" class="article-thumb" alt="${frontmatter.title || '대표 이미지'}">` : ''}
          <div class="article-body">
            ${htmlBody}
          </div>
        `;

        // 📌 9. 동적 JSON-LD 스키마 마크업 작성 (SEO & BreadcrumbList)
        const jsonLdData = {
          "@context": "https://schema.org",
          "@graph": [
            {
              "@type": "NewsArticle",
              "headline": frontmatter.title || '',
              "description": frontmatter.excerpt || '',
              "image": frontmatter.thumbnail ? [frontmatter.thumbnail] : [],
              "datePublished": frontmatter.date ? String(frontmatter.date).substring(0, 10) : '',
              "author": {
                "@type": "Organization",
                "name": "시니어내일포럼"
              }
            },
            {
              "@type": "BreadcrumbList",
              "@id": `${articleUrl}#breadcrumb`,
              "itemListElement": [
                {
                  "@type": "ListItem",
                  "position": 1,
                  "name": "홈",
                  "item": `${window.location.origin}/index.html`
                },
                {
                  "@type": "ListItem",
                  "position": 2,
                  "name": frontmatter.category || "카테고리",
                  "item": `${window.location.origin}/jobs.html`
                },
                {
                  "@type": "ListItem",
                  "position": 3,
                  "name": frontmatter.title || "기사 상세",
                  "item": articleUrl
                }
              ]
            }
          ]
        };

        const scriptTag = document.createElement("script");
        scriptTag.type = "application/ld+json";
        scriptTag.text = JSON.stringify(jsonLdData);
        document.head.appendChild(scriptTag);

      } catch (err) {
        console.error(err);
        contentDiv.innerHTML = "<p style='text-align:center;'>기사를 로딩하는 중 오류가 발생했습니다.</p>";
      }
    });

    // 📌 10. 스크롤 진행바 작동 로직
    window.addEventListener("scroll", () => {
      const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
      const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      const scrolled = (winScroll / height) * 100;
      const progressBar = document.getElementById("progress-bar");
      if (progressBar) {
        progressBar.style.width = scrolled + "%";
      }
    });

    // 모바일 메뉴 토글
    const menuToggle = document.getElementById('menuToggle');
    const mainNav = document.getElementById('mainNav');
    if (menuToggle && mainNav) {
      menuToggle.addEventListener('click', () => mainNav.classList.toggle('open'));
    }
  </script>
</body>
</html>
