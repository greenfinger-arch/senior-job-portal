<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>기사 상세 보기 - 시니어내일포럼</title>

  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="/style.css">

  <!-- 📌 파비콘 및 모바일 아이콘 추가 -->
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon-180x180.png">

  <style>
    body {
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif !important;
      background-color: #f8fafc;
      color: #1e293b;
      margin: 0;
      padding: 0;
    }

    #progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 4px;
      background: #0f172a;
      width: 0%;
      z-index: 9999;
      transition: width 0.1s ease-out;
    }

    .article-container { 
      max-width: 820px; 
      margin: 40px auto; 
      padding: 50px 40px; 
      background: #ffffff;
      border-radius: 6px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
      border: 1px solid #cbd5e1;
    }
    
    .article-header { 
      border-bottom: 2px solid #0f172a; 
      padding-bottom: 25px; 
      margin-bottom: 35px; 
    }

    .article-category { 
      display: inline-block; 
      padding: 4px 12px; 
      border-radius: 3px; 
      font-size: 14px; 
      font-weight: 700; 
      color: #ffffff; 
      background-color: #0369a1;
      margin-bottom: 16px; 
    }

    .article-title { 
      font-size: 2.2rem; 
      line-height: 1.4; 
      margin: 0 0 20px 0; 
      color: #0f172a; 
      font-weight: 800;
      word-break: keep-all;
      letter-spacing: -0.02em;
    }

    .article-meta-info {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #64748b;
      font-size: 14px;
      font-weight: 500;
      flex-wrap: wrap;
    }

    .article-thumb { 
      width: 100%; 
      max-height: 460px; 
      object-fit: cover; 
      border-radius: 4px; 
      margin-bottom: 40px; 
      border: 1px solid #cbd5e1;
    }

    .article-body { 
      font-size: 1.15rem; 
      line-height: 1.9; 
      color: #334155; 
      word-break: keep-all;
    }

    .article-body h2 { 
      font-size: 1.55rem; 
      color: #0f172a;
      border-left: 4px solid #0f172a; 
      padding-left: 14px; 
      margin: 45px 0 20px; 
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .article-body h3 { 
      font-size: 1.3rem; 
      color: #1e293b;
      margin: 32px 0 16px; 
      padding-bottom: 8px;
      border-bottom: 1px solid #cbd5e1;
      font-weight: 700;
    }

    .article-body p { margin-bottom: 22px; }
    .article-body strong { color: #0f172a; font-weight: 700; background: linear-gradient(to top, #e2e8f0 50%, transparent 50%); }

    .article-body blockquote { 
      background-color: #f8fafc; 
      border-left: 4px solid #0f172a; 
      padding: 20px 24px; 
      margin: 30px 0; 
      border-radius: 0 6px 6px 0; 
      color: #1e293b;
      font-size: 1.08rem;
      border-top: 1px solid #cbd5e1;
      border-right: 1px solid #cbd5e1;
      border-bottom: 1px solid #cbd5e1;
    }

    .article-body table { 
      width: 100%; 
      border-collapse: collapse; 
      margin: 32px 0; 
      border: 1px solid #cbd5e1;
      display: block;
      overflow-x: auto;
      white-space: nowrap;
    }

    .article-body th, .article-body td { border: 1px solid #cbd5e1; padding: 14px 16px; text-align: left; font-size: 1.02rem; }
    .article-body th { background-color: #f8fafc; color: #0f172a; font-weight: 700; }
    .article-body tr:nth-child(even) { background-color: #f8fafc; }

    .back-btn-wrapper { margin-top: 50px; padding-top: 25px; border-top: 1px solid #cbd5e1; }
    .back-btn { display: inline-block; padding: 12px 24px; background: #0f172a; color: #ffffff; text-decoration: none; border-radius: 4px; font-weight: 700; font-size: 15px; cursor: pointer; }
    .back-btn:hover { background: #0369a1; }

    @media (max-width: 768px) {
      .article-container { padding: 28px 20px; margin: 15px auto; }
      .article-title { font-size: 1.75rem; }
    }
  </style>
</head>
<body>

  <div id="progress-bar"></div>

  <header class="site-header">
    <div class="header-inner">
      <!-- 📌 이미지 로고 적용 -->
      <a href="/" class="brand-logo">
        <img src="/images/logo.png" alt="시니어내일포럼" class="logo-image">
      </a>
      <button class="mobile-menu-toggle" id="menuToggle" aria-label="메뉴 열기">
        <span></span><span></span><span></span>
      </button>
      <nav class="main-nav" id="mainNav">
        <ul>
          <li><a href="/">전체보기</a></li>
          <li><a href="/jobs.html">시니어 재취업</a></li>
          <li><a href="/side-hustle.html">중장년 부업/N잡</a></li>
          <li><a href="/education.html">교육/자격증</a></li>
          <li><a href="/welfare.html">정부 지원금</a></li>
          <li><a href="/senior-startup.html">시니어 창업</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="article-container">
    <div id="articleContent">
      <p style="text-align: center; padding: 60px 0; color: #64748b;">기사 내용을 불러오는 중입니다...</p>
    </div>
    
    <div class="back-btn-wrapper">
      <a id="backBtn" href="/" class="back-btn">&larr; 목록으로 돌아가기</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <script>
    const GITHUB_REPO = "greenfinger-arch/senior-job-portal";
    const GITHUB_BRANCH = "main";

    const CATEGORY_URL_MAP = {
      "시니어 재취업": "https://rework5060.com/jobs.html",
      "중장년 부업/N잡": "https://rework5060.com/side-hustle.html",
      "교육/자격증": "https://rework5060.com/education.html",
      "정부 지원금": "https://rework5060.com/welfare.html",
      "시니어 창업": "https://rework5060.com/senior-startup.html"
    };

    marked.setOptions({ gfm: true, breaks: true });

    function getSlugFromUrl() {
      const pathSegments = window.location.pathname.split('/').filter(Boolean);
      let rawSlug = "";
      
      if (pathSegments.length > 0) {
        const firstSegment = pathSegments[0];
        
        const categoryList = ['jobs', 'jobs.html', 'side-hustle', 'side-hustle.html', 'education', 'education.html', 'welfare', 'welfare.html', 'senior-startup', 'senior-startup.html', 'index.html', 'article.html', '404.html'];
        if (categoryList.includes(firstSegment) || firstSegment.endsWith('.html')) {
          return ""; 
        }

        rawSlug = firstSegment;
      }
      
      if (!rawSlug) {
        const urlParams = new URLSearchParams(window.location.search);
        rawSlug = urlParams.get("slug") || "";
      }

      try {
        return decodeURIComponent(rawSlug).trim();
      } catch (e) {
        return rawSlug.trim();
      }
    }

    function cleanMarkdownFormatting(text) {
      if (!text) return "";
      return text
        .replace(/\*\s*["'“‘]\s*\*\*(.*?)\*\*\s*["'”’]\s*\*/g, '<em>"$1"</em>')
        .replace(/(["'“‘])\s*\*\*(.*?)\*\*\s*(["'”’])/g, '$1<strong>$2</strong>$3')
        .replace(/\*\*\s*(["'“‘].*?["'”’])\s*\*\*/g, '<strong>$1</strong>')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    }

    function updateMetaTags(frontmatter, articleUrl) {
      const description = frontmatter.excerpt || frontmatter.summary || frontmatter.title || '5060 시니어 재취업 및 일자리 정보 포털 시니어내일포럼';
      const image = frontmatter.thumbnail || `${window.location.origin}/images/default-og.png`;

      const metaList = [
        { name: "description", content: description },
        { property: "og:title", content: `${frontmatter.title} - 시니어내일포럼` },
        { property: "og:description", content: description },
        { property: "og:image", content: image },
        { property: "og:url", content: articleUrl },
        { property: "og:type", content: "article" },
        { name: "twitter:card", content: "summary_large_image" },
        { name: "twitter:title", content: frontmatter.title },
        { name: "twitter:description", content: description },
        { name: "twitter:image", content: image }
      ];

      metaList.forEach(data => {
        let el = data.name 
          ? document.querySelector(`meta[name="${data.name}"]`)
          : document.querySelector(`meta[property="${data.property}"]`);

        if (!el) {
          el = document.createElement("meta");
          if (data.name) el.setAttribute("name", data.name);
          if (data.property) el.setAttribute("property", data.property);
          document.head.appendChild(el);
        }
        el.setAttribute("content", data.content);
      });

      let canonicalEl = document.querySelector('link[rel="canonical"]');
      if (!canonicalEl) {
        canonicalEl = document.createElement('link');
        canonicalEl.setAttribute('rel', 'canonical');
        document.head.appendChild(canonicalEl);
      }
      canonicalEl.setAttribute('href', articleUrl);
    }

    function calculateReadingTime(text) {
      const wordsPerMinute = 200;
      const cleanText = text.replace(/<[^>]*>?/gm, '');
      const minutes = Math.ceil(cleanText.length / wordsPerMinute);
      return minutes < 1 ? 1 : minutes;
    }

    document.addEventListener("DOMContentLoaded", async () => {
      const targetSlug = getSlugFromUrl();
      const contentDiv = document.getElementById("articleContent");

      if (!targetSlug) {
        contentDiv.innerHTML = "<p style='text-align:center; padding: 60px 0;'>존재하지 않는 페이지이거나 잘못된 경로입니다.</p>";
        return;
      }

      try {
        const listUrl = `https://api.github.com/repos/${GITHUB_REPO}/contents/posts?ref=${GITHUB_BRANCH}`;
        const listRes = await fetch(listUrl);
        if (!listRes.ok) throw new Error("포스트 목록을 불러올 수 없습니다.");
        const files = await listRes.json();
        const mdFiles = files.filter(f => f.name.endsWith('.md'));

        let matchedMetadata = null;
        let matchedBody = '';

        for (const file of mdFiles) {
          const rawRes = await fetch(file.download_url);
          const fileText = await rawRes.text();
          const parts = fileText.split(/^---$/m);
          
          let meta = {};
          if (parts.length >= 3) {
            meta = jsyaml.load(parts[1]) || {};
          }

          let fileSlug = meta.slug || file.name.replace(/^\d{4}-\d{2}-\d{2}-/, '').replace(/\.md$/, '');
          fileSlug = String(fileSlug).trim();

          if (fileSlug === targetSlug) {
            matchedMetadata = meta;
            matchedBody = parts.slice(2).join('---').trim();
            break;
          }
        }

        if (!matchedMetadata) {
          contentDiv.innerHTML = "<p style='text-align:center; padding:60px 0;'>기사를 찾을 수 없습니다.</p>";
          return;
        }

        if (matchedMetadata.date) {
          const publishDate = new Date(matchedMetadata.date);
          if (publishDate > new Date()) {
            const formattedPublishDate = publishDate.toLocaleString('ko-KR', {
              year: 'numeric',
              month: 'long',
              day: 'numeric',
              hour: '2-digit',
              minute: '2-digit'
            });

            contentDiv.innerHTML = `
              <div style="text-align: center; padding: 80px 20px; background: #f8fafc; border-radius: 6px; border: 1px dashed #cbd5e1;">
                <p style="font-size: 2.5rem; margin-bottom: 10px;">⏳</p>
                <h2 style="font-size: 1.4rem; color: #0f172a; margin-bottom: 12px; font-weight: 700;">예약 발행 예정 기사입니다</h2>
                <p style="color: #64748b; font-size: 1rem; margin-bottom: 0;">
                  본 기사는 <strong>${formattedPublishDate}</strong>에 공개될 예정입니다.
                </p>
              </div>
            `;
            return;
          }
        }

        let htmlBody = typeof marked.parse === "function" ? marked.parse(matchedBody) : marked(matchedBody);
        htmlBody = cleanMarkdownFormatting(htmlBody);
        htmlBody = htmlBody.replace(/<img /g, `<img loading="lazy" alt="${matchedMetadata.title || '기사 이미지'}" `);

        const canonicalUrl = `https://rework5060.com/${targetSlug}`;
        if (matchedMetadata.title) {
          document.title = `${matchedMetadata.title} - 시니어내일포럼`;
        }
        updateMetaTags(matchedMetadata, canonicalUrl);

        const readingTime = calculateReadingTime(matchedBody);

        contentDiv.innerHTML = `
          <article class="article-header">
            <span class="article-category">${matchedMetadata.category || '기타'}</span>
            <h1 class="article-title">${matchedMetadata.title || '제목 없음'}</h1>
            <div class="article-meta-info">
              <span>발행일: ${matchedMetadata.date ? String(matchedMetadata.date).substring(0, 10) : ''}</span>
              <span>•</span>
              <span>시니어내일포럼 편집국</span>
              <span>•</span>
              <span>소요 시간 약 ${readingTime}분</span>
            </div>
          </article>
          ${matchedMetadata.thumbnail ? `<img src="${matchedMetadata.thumbnail}" class="article-thumb" alt="${matchedMetadata.title || '대표 이미지'}">` : ''}
          <div class="article-body">
            ${htmlBody}
          </div>
        `;

        const categoryName = matchedMetadata.category || "카테고리";
        const categoryUrl = CATEGORY_URL_MAP[categoryName] || "https://rework5060.com/";

        const jsonLdData = {
          "@context": "https://schema.org",
          "@graph": [
            {
              "@type": "NewsArticle",
              "headline": matchedMetadata.title || '',
              "description": matchedMetadata.excerpt || matchedMetadata.summary || '',
              "image": matchedMetadata.thumbnail ? [matchedMetadata.thumbnail] : [],
              "datePublished": matchedMetadata.date ? String(matchedMetadata.date).substring(0, 10) : '',
              "author": {
                "@type": "Organization",
                "name": "시니어내일포럼",
                "url": "https://rework5060.com"
              }
            },
            {
              "@type": "BreadcrumbList",
              "@id": `${canonicalUrl}#breadcrumb`,
              "itemListElement": [
                {
                  "@type": "ListItem",
                  "position": 1,
                  "name": "홈",
                  "item": "https://rework5060.com/"
                },
                {
                  "@type": "ListItem",
                  "position": 2,
                  "name": categoryName,
                  "item": categoryUrl
                },
                {
                  "@type": "ListItem",
                  "position": 3,
                  "name": matchedMetadata.title || "기사 상세",
                  "item": canonicalUrl
                }
              ]
            }
          ]
        };

        const scriptTag = document.createElement("script");
        scriptTag.type = "application/ld+json";
        scriptTag.text = JSON.stringify(jsonLdData);
        document.head.appendChild(scriptTag);

      } catch (err) {
        console.error(err);
        contentDiv.innerHTML = "<p style='text-align:center; padding:60px 0;'>기사를 로딩하는 중 오류가 발생했습니다.</p>";
      }
    });

    window.addEventListener("scroll", () => {
      const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
      const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      const scrolled = (winScroll / height) * 100;
      const progressBar = document.getElementById("progress-bar");
      if (progressBar) {
        progressBar.style.width = scrolled + "%";
      }
    });

    const backBtn = document.getElementById('backBtn');
    if (backBtn) {
      backBtn.addEventListener('click', (e) => {
        if (document.referrer && document.referrer.includes(window.location.host)) {
          e.preventDefault();
          window.history.back();
        }
      });
    }

    const menuToggle = document.getElementById('menuToggle');
    const mainNav = document.getElementById('mainNav');
    if (menuToggle && mainNav) {
      menuToggle.addEventListener('click', () => mainNav.classList.toggle('open'));
    }
  </script>
</body>
</html>
