name: Generate Sitemap

on:
  push:
    branches:
      - main
    paths:
      - 'posts/**'
      - '**.html'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Sitemap XML
        run: |
          DOMAIN="https://rework5060.com"
          
          # sitemap.xml 헤더 작성
          echo '<?xml version="1.0" encoding="UTF-8"?>' > sitemap.xml
          echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' >> sitemap.xml
          
          # 1. 고정 페이지(홈 및 주요 카테고리) 추가
          cat << 'EOF' >> sitemap.xml
            <url>
              <loc>${DOMAIN}/</loc>
              <changefreq>daily</changefreq>
              <priority>1.0</priority>
            </url>
            <url>
              <loc>${DOMAIN}/jobs.html</loc>
              <changefreq>weekly</changefreq>
              <priority>0.8</priority>
            </url>
            <url>
              <loc>${DOMAIN}/side-hustle.html</loc>
              <changefreq>weekly</changefreq>
              <priority>0.8</priority>
            </url>
            <url>
              <loc>${DOMAIN}/education.html</loc>
              <changefreq>weekly</changefreq>
              <priority>0.8</priority>
            </url>
            <url>
              <loc>${DOMAIN}/welfare.html</loc>
              <changefreq>weekly</changefreq>
              <priority>0.8</priority>
            </url>
            <url>
              <loc>${DOMAIN}/senior-startup.html</loc>
              <changefreq>weekly</changefreq>
              <priority>0.8</priority>
            </url>
          EOF

          # 2. posts 폴더 내의 마크다운 파일들을 읽어 슬러그 추출 후 sitemap에 동적 추가
          if [ -d "posts" ]; then
            for file in posts/*.md; do
              if [ -f "$file" ]; then
                # yaml frontmatter에서 slug 값을 찾거나, 파일명(날짜 및 확장자 제거)을 슬러그로 추출
                filename=$(basename "$file" .md)
                slug=$(grep -m 1 "^slug:" "$file" | sed 's/slug:[[:space:]]*//g' | tr -d '"' | tr -d "'" | tr -d '\r')
                
                if [ -z "$slug" ]; then
                  # slug 필드가 없으면 날짜 패턴(YYYY-MM-DD-)을 제거한 파일명을 슬러그로 사용
                  slug=$(echo "$filename" | sed -E 's/^[0-9]{4}-[0-9]{2}-[0-9]{2}-//')
                fi
                
                # sitemap에 개별 기사 URL 추가
                echo "  <url>" >> sitemap.xml
                echo "    <loc>${DOMAIN}/${slug}</loc>" >> sitemap.xml
                echo "    <changefreq>monthly</changefreq>" >> sitemap.xml
                echo "    <priority>0.6</priority>" >> sitemap.xml
                echo "  </url>" >> sitemap.xml
              fi
            done
          fi

          # sitemap.xml 푸터 닫기
          echo '</urlset>' >> sitemap.xml

      - name: Commit and Push Sitemap if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-generate sitemap.xml" && git push)
