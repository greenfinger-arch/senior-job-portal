name: Generate Sitemap

on:
  push:
    branches:
      - main
    paths:
      - 'posts/**'
      - '**.html'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Sitemap XML
        run: |
          TODAY=$(date +%Y-%m-%d)
          
          # sitemap.xml 헤더 작성
          echo '<?xml version="1.0" encoding="UTF-8"?>' > sitemap.xml
          echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' >> sitemap.xml
          
          # 1. 고정 페이지(홈 및 주요 카테고리) 추가
          pages=("" "jobs.html" "side-hustle.html" "education.html" "welfare.html" "senior-startup.html")
          
          for page in "${pages[@]}"; do
            echo "<url>" >> sitemap.xml
            if [ -z "$page" ]; then
              echo "<loc>https://rework5060.com/</loc>" >> sitemap.xml
              echo "<priority>1.0</priority>" >> sitemap.xml
            else
              echo "<loc>https://rework5060.com/${page}</loc>" >> sitemap.xml
              echo "<priority>0.8</priority>" >> sitemap.xml
            fi
            echo "<lastmod>${TODAY}</lastmod>" >> sitemap.xml
            echo "<changefreq>daily</changefreq>" >> sitemap.xml
            echo "</url>" >> sitemap.xml
          done

          # 2. posts 폴더 내 마크다운 기사 목록 동적 추가
          if [ -d "posts" ]; then
            for file in posts/*.md; do
              if [ -f "$file" ]; then
                filename=$(basename "$file" .md)
                slug=$(grep -m 1 "^slug:" "$file" | sed 's/slug:[[:space:]]*//g' | tr -d '"' | tr -d "'" | tr -d '\r')
                
                if [ -z "$slug" ]; then
                  slug=$(echo "$filename" | sed -E 's/^[0-9]{4}-[0-9]{2}-[0-9]{2}-//')
                fi
                
                # 파일의 Git 마지막 수정일 추출
                file_date=$(git log -1 --format="%ai" -- "$file" | cut -d' ' -f1)
                if [ -z "$file_date" ]; then
                  file_date="${TODAY}"
                fi
                
                echo "<url>" >> sitemap.xml
                echo "<loc>https://rework5060.com/${slug}</loc>" >> sitemap.xml
                echo "<lastmod>${file_date}</lastmod>" >> sitemap.xml
                echo "<changefreq>monthly</changefreq>" >> sitemap.xml
                echo "<priority>0.6</priority>" >> sitemap.xml
                echo "</url>" >> sitemap.xml
              fi
            done
          fi

          # sitemap.xml 푸터 닫기
          echo '</urlset>' >> sitemap.xml

      - name: Commit and Push Sitemap if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-generate clean sitemap.xml" && git push)
